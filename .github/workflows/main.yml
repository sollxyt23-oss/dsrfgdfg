name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          # If the mod builds but won't load in your game, the SDK/bindings
          # version probably doesn't match your installed Geode. Change the
          # refs below to the release that supports your GD version.
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: Win64

  package:
    name: Package build
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
